name: Release container contract

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example, v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish header contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build and test
        run: nix build .#checks.x86_64-linux.tests -L

      - name: Package headers
        id: package
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          version="${release_tag#v}"
          output="$(nix build .#logos-container-include --no-link --print-out-paths)"
          archive="logos-container-${version}.tar.gz"
          tar -C "$output" -czf "$archive" include
          sha256sum "$archive" > "$archive.sha256"
          test -s "$archive"
          test -s "$archive.sha256"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify archive
        working-directory: .
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: sha256sum --check "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "logos-container $RELEASE_TAG" \
              --notes "Header contract release $RELEASE_TAG." \
              "$ARCHIVE" "$ARCHIVE.sha256"
          else
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          fi
